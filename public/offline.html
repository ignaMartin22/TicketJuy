      .logo svg { display: block; width: 100%; height: auto; }
      h1 { margin: 20px 0 6px; font-size: 1.5rem; }
      p { margin: 0; color: #9c98ae; max-width: 22rem; }
      button { margin-top: 24px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #f6f6f6; color: #05040a; font: 600 1rem system-ui, sans-serif; }

      <p>Para ver las fechas y comprar entradas necesitás internet. Conectate y probá de nuevo.</p>
